<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPU Process Scheduling Simulator</title>
    <meta name="description" content="Interactive educational CPU scheduling simulator for Operating Systems students to visualize FCFS, SJF, SRTF, Priority, and Round Robin algorithms with dynamic Gantt charts, metrics, and comparisons." />
    <meta property="og:title" content="CPU Process Scheduling Simulator" />
    <meta property="og:description" content="Interactive educational CPU scheduling simulator for Operating Systems students to visualize FCFS, SJF, SRTF, Priority, and Round Robin algorithms with dynamic Gantt charts, metrics, and comparisons." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root">
      <main id="boot-screen" style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a">
        <section style="text-align:center;max-width:680px">
          <h1 style="margin:0 0 10px;font-size:28px">CPU Process Scheduling Simulator</h1>
          <p style="margin:0;color:#64748b">Loading simulator…</p>
        </section>
      </main>
    </div>
    <script>
      // Keep a useful diagnostic visible if the JavaScript bundle cannot start.
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var boot = document.getElementById('boot-screen');
        if (root && boot && boot.parentNode === root) {
          boot.innerHTML =
            '<section style="text-align:center;max-width:680px">' +
            '<h1 style="margin:0 0 10px;font-size:28px;color:#b91c1c">Simulator could not start</h1>' +
            '<p style="margin:0 0 14px;color:#475569">The page loaded, but the JavaScript application did not start. Please hard-refresh this page (Ctrl+Shift+R).</p>' +
            '<p style="margin:0;color:#64748b;font-size:14px">If this message remains, the GitHub Pages deployment needs to be rebuilt.</p>' +
            '</section>';
        }
      }, 8000);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
